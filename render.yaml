services:
  - type: web
    name: revenuepilot
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: DOWNLOAD_SECRET
        generateValue: true
      - key: DEFAULT_MARKET
        value: US
      - key: AUTO_LANGUAGES
        value: es,en
      - key: AUTO_MIN_SCORE
        value: 80
      - key: AUTO_GENERATE_PRODUCTS
        value: false
      - key: AUTO_PUBLISH_PRODUCTS
        value: false
