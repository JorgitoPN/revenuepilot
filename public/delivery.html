<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrega de producto</title><style>body{margin:0;background:#f4f3f0;font-family:Inter,system-ui;color:#202327}.box{max-width:640px;margin:12vh auto;background:#fff;border:1px solid #e3e0da;border-radius:20px;padding:25px}.sub{color:#727982;line-height:1.5}.btn{display:inline-block;background:#222429;color:#fff;padding:11px 14px;border-radius:10px;text-decoration:none;font-weight:800}.err{color:#9a4149}</style></head><body><div class="box"><h1>Verificando tu pago…</h1><p id="msg" class="sub">Estamos comprobando la sesión directamente con Stripe antes de habilitar la descarga.</p><div id="action"></div></div><script>(async()=>{const id=new URLSearchParams(location.search).get('session_id');if(!id){msg.innerHTML='<span class="err">Falta la sesión de Stripe.</span>';return}try{const r=await fetch('/api/delivery/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:id})});const j=await r.json();if(!r.ok)throw new Error(j.error||'No se pudo verificar el pago');document.querySelector('h1').textContent='Pago verificado';msg.textContent='Tu producto está listo. El enlace de descarga caduca en 72 horas.';action.innerHTML=`<a class="btn" href="${j.download_url}">Descargar ${j.product_name}</a>`}catch(e){msg.innerHTML='<span class="err">'+e.message+'</span>'}})();</script></body></html>
